# Builds the suite and runs the tests that need no browser, no cloud and no
# keys, so a change here is checked before a language repository picks it up.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release

      # No environment variables are set, which is the point: the suite must
      # not demand settings that the tests being run do not use.
      - name: Test
        run: >
          dotnet test -c Release --no-build
          --filter "TestCategory!=Contract&TestCategory!=CloudInternal"
