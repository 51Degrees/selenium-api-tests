# Builds the suite and runs it, so a change here is checked before a language
# repository picks it up.
#
# Three jobs, because they answer different questions. The first runs the tests
# that need no browser, no cloud and no keys. The second starts a real browser
# on each runner the language repositories use, including the ARM64 Linux ones,
# and fails when one will not start, which is the fault the second job exists
# to catch. The third starts CloakBrowser in its vendor's container and runs
# the same check with a driver attached to it.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release

      # No environment variables are set, which is the point: the suite must
      # not demand settings that the tests being run do not use.
      - name: Test
        run: >
          dotnet test -c Release --no-build
          --filter "TestCategory!=Contract&TestCategory!=CloudInternal&TestCategory!=Browser"

  browsers:
    name: Browsers on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The ARM64 images are here because a browser suite that could not
        # start a browser on them was reported as passing for as long as nobody
        # read the log. ubuntu-22.04-arm is the image the language repositories
        # run their ARM jobs on.
        os: [ubuntu-latest, ubuntu-22.04-arm, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Say what the runner brought, so a later change of image is readable
      # from the log rather than guessed at.
      - name: What this runner provides
        run: |
          echo "arch: $(uname -m)"
          echo "CHROMEWEBDRIVER: ${CHROMEWEBDRIVER:-<unset>}"
          echo "GECKOWEBDRIVER: ${GECKOWEBDRIVER:-<unset>}"
          echo "EDGEWEBDRIVER: ${EDGEWEBDRIVER:-<unset>}"
          for exe in google-chrome chromium chromedriver firefox geckodriver \
                     microsoft-edge msedgedriver; do
            echo "$exe: $(command -v $exe || echo '<not on the path>')"
          done

      - name: Build
        run: dotnet build -c Release

      - name: Start a browser
        run: dotnet test -c Release --no-build --filter "TestCategory=Browser"

  cloak:
    name: CloakBrowser on ubuntu-latest
    runs-on: ubuntu-latest
    env:
      # The vendor's image by digest, so the browser cannot change under the
      # tag. The browser is closed source and only ever runs in this container.
      CLOAK_IMAGE: cloakhq/cloakbrowser:0.5.12@sha256:2fdd1289154f30594c7bab74943ea7baa6b617a9ec026ab4bf339c2ebabcb712
      CLOAK_DEBUGGER_ADDRESS: 127.0.0.1:9222
      # Selenium Manager fetches the driver for the browser in the container
      # and would otherwise download a Chrome of that version that nothing
      # runs.
      SE_AVOID_BROWSER_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Host networking lets the browser reach the page the tests serve on
      # localhost. Update checks are off, so the browser that runs is the one
      # in the image. Nothing from the runner is mounted and no secret is
      # passed. The first request for the version starts the browser, and
      # its answer is printed so the log says which browser ran.
      - name: Start CloakBrowser
        run: |
          docker run -d --name cloak --network host \
            -e CLOAKBROWSER_AUTO_UPDATE=false \
            "$CLOAK_IMAGE" cloakserve
          for attempt in $(seq 1 30); do
            if curl -fsS "http://$CLOAK_DEBUGGER_ADDRESS/json/version"; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "CloakBrowser did not answer on $CLOAK_DEBUGGER_ADDRESS"
          docker logs cloak
          exit 1

      - name: Build
        run: dotnet build -c Release

      # Only the tests that attach to CloakBrowser run here, as the browsers
      # job already starts Chrome and Firefox on this image. A Cloak test that
      # was skipped would leave this job green having attached to nothing, so
      # the pass is looked for by name.
      - name: Attach to CloakBrowser
        run: |
          set -o pipefail
          dotnet test -c Release --no-build \
            --filter "TestCategory=Browser&Name~Cloak_" \
            --logger "console;verbosity=normal" | tee browser-tests.log
          grep -q "Passed Cloak_RunsThePage" browser-tests.log

      - name: Stop CloakBrowser
        if: always()
        run: |
          docker logs cloak || true
          docker rm -f cloak || true
